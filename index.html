<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>머지 서바이벌 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE3C8;
    --card:#FBF6E9;
    --ink:#2E2A22;
    --ink-soft:#6b6252;
    --moss:#4F7355;
    --moss-dark:#3A5540;
    --amber:#D89A3D;
    --amber-dark:#B87F26;
    --rust:#C1502E;
    --rust-dark:#9C3D22;
    --wood:#8B6B4A;
    --broken:#6E7480;
    --line: rgba(46,42,34,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, rgba(255,255,255,0.35), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .wrap{max-width:480px;margin:0 auto;padding:0 14px;}

  header.top{
    background:var(--paper);
    padding:14px 0 6px;
  }
  .stickybar{
    position:sticky;top:0;z-index:20;
    background:var(--paper);
    padding:8px 0 8px;
    border-bottom:2px dashed var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 2px;}
  .brand .badge{
    width:40px;height:40px;border-radius:50%;
    background:var(--moss);color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:'Jua',sans-serif;font-size:20px;flex:none;
    box-shadow:0 2px 0 var(--moss-dark);
  }
  .brand h1{font-family:'Jua',sans-serif;font-weight:400;font-size:19px;margin:0;letter-spacing:.2px;}
  .brand p{margin:1px 0 0;font-size:11.5px;color:var(--ink-soft);}

  .searchbar{margin-top:10px;position:relative;}
  .searchbar input{
    width:100%;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);
    background:var(--card);font-family:inherit;font-size:13.5px;color:var(--ink);
  }
  .searchbar input:focus{outline:2px solid var(--moss);outline-offset:1px;}

  .tabs{display:flex;gap:6px;margin-top:2px;overflow-x:auto;padding-bottom:2px;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:none;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);
    background:var(--card);font-size:12.5px;font-weight:600;color:var(--ink-soft);
    cursor:pointer;white-space:nowrap;
  }
  .tab.active{background:var(--moss);border-color:var(--moss-dark);color:#fff;}

  .subtabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;}
  .subtabs::-webkit-scrollbar{display:none;}
  .subtab{
    flex:none;padding:4px 10px;border-radius:999px;border:1.5px dashed var(--wood);
    background:transparent;font-size:11.5px;font-weight:600;color:var(--wood);cursor:pointer;white-space:nowrap;
  }
  .subtab.active{background:var(--amber);border-style:solid;border-color:var(--amber-dark);color:#fff;}

  .legend{
    display:flex;gap:10px;flex-wrap:wrap;margin:10px 2px 2px;font-size:10.5px;color:var(--ink-soft);
  }
  .legend span{display:inline-flex;align-items:center;gap:4px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .tip{font-size:10.5px;color:var(--ink-soft);margin:6px 2px 0;}

  .section-label{
    display:flex;align-items:center;gap:8px;margin:20px 2px 10px;
    font-family:'Jua',sans-serif;font-size:14px;color:var(--wood);
  }
  .section-label::after{content:"";flex:1;height:0;border-top:2px dashed var(--line);}

  .card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-left:5px dashed var(--wood);
    border-radius:12px;
    padding:12px 12px 12px 14px;
    margin-bottom:10px;
    box-shadow:0 2px 0 rgba(46,42,34,0.06);
  }
  .card-head{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .icon-badge{
    width:34px;height:34px;border-radius:9px;background:#fff;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;
    color:var(--wood);
  }
  .icon-badge svg{width:20px;height:20px;}
  .card-title{flex:1;min-width:0;}
  .card-title .name{font-weight:700;font-size:14.5px;}
  .card-title .preview{font-size:11px;color:var(--ink-soft);margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chev{font-size:12px;color:var(--ink-soft);transition:transform .15s ease;flex:none;}
  .card.open .chev{transform:rotate(90deg);}

  .card-body{display:none;margin-top:12px;padding-top:10px;border-top:1.5px dashed var(--line);}
  .card.open .card-body{display:block;}

  .stage-block{margin-bottom:14px;}
  .stage-block:last-child{margin-bottom:2px;}
  .stage-title{display:flex;align-items:baseline;gap:6px;font-size:12.5px;font-weight:700;margin-bottom:6px;}
  .stage-title .max{color:var(--ink-soft);font-weight:500;font-size:11.5px;}
  .stage-note{font-size:10.5px;color:var(--amber-dark);margin:-3px 0 6px;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .chip{
    position:relative;
    min-width:62px;
    border-radius:9px;
    background:#fff;
    border:1.5px solid var(--moss);
    padding:6px 6px 5px;
    text-align:center;
    user-select:none;
  }
  .chip.stored{opacity:.6; border-style:dashed;}
  .loc-tag{
    position:absolute;top:-8px;left:-6px;font-size:8.5px;font-weight:700;color:#fff;
    background:var(--wood);border-radius:5px;padding:1px 4px;line-height:1.4;
  }
  .chip .count{font-family:'Jua',sans-serif;font-size:16px;line-height:1;color:var(--moss-dark);}
  .chip .bar{height:4px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden;}
  .chip .bar i{display:block;height:100%;background:var(--moss);}
  .chip .plusbtn{
    display:block;width:100%;margin-top:5px;padding:4px 0;border:none;border-radius:6px;
    background:var(--moss);color:#fff;font-family:'Jua',sans-serif;font-size:13px;cursor:pointer;
    touch-action:none;
  }
  .chip .ctrl{display:flex;justify-content:space-between;margin-top:4px;gap:3px;}
  .chip .ctrl button{
    flex:1;border:none;background:#F1EBDA;color:var(--ink-soft);font-size:11px;border-radius:5px;
    padding:3px 2px;cursor:pointer;line-height:1.3;
  }
  .chip .ctrl button.confirm{background:var(--rust);color:#fff;font-weight:700;}
  .chip.ready{border-color:var(--amber-dark);background:#FFF6E4;}
  .chip.ready .count{color:var(--amber-dark);}
  .chip.ready .bar i{background:var(--amber);}
  .chip.ready .plusbtn{background:var(--amber-dark);}
  .chip.pop{border-color:var(--rust-dark);background:#FBE9E3;animation:pulse 1.4s infinite;}
  .chip.pop .count{color:var(--rust-dark);}
  .chip.pop .bar i{background:var(--rust);}
  .chip.pop .plusbtn{background:var(--rust-dark);}
  .chip.broken{border-color:var(--broken);background:#EDEEF0;}
  .chip.broken .count{color:var(--broken);}
  .chip.broken .plusbtn{background:var(--broken);}
  .chip .tag{position:absolute;top:-8px;right:-6px;font-size:13px;}
  .cycle{font-size:9.5px;color:var(--ink-soft);margin-top:3px;}
  .stored-label{font-size:10.5px;color:var(--wood);font-weight:700;margin:8px 0 4px;}

  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(193,80,46,.35);}50%{box-shadow:0 0 0 5px rgba(193,80,46,0);}}

  .addchip{
    min-width:44px;border-radius:10px;border:1.5px dashed var(--ink-soft);
    color:var(--ink-soft);display:flex;align-items:center;justify-content:center;
    padding:6px 10px;font-size:18px;cursor:pointer;background:transparent;
  }

  .actionrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .btn-sm{
    border:none;border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:700;
    cursor:pointer;color:#fff;
  }
  .btn-merge{background:var(--moss);}
  .btn-repair{background:var(--broken);}
  .btn-harvest{background:#3D74A8;}

  .empty{text-align:center;color:var(--ink-soft);font-size:12.5px;padding:30px 10px;}

  footer{
    max-width:480px;margin:26px auto 0;padding:0 14px;text-align:center;
  }
  .resetbtn{
    background:transparent;border:1.5px solid var(--rust);color:var(--rust-dark);
    border-radius:10px;padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;
  }
  .savehint{font-size:10.5px;color:var(--ink-soft);margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div id="collapsible">
      <div class="brand">
        <div class="badge">⛺</div>
        <div>
          <h1>머지 서바이벌 노트</h1>
          <p>아이템 사용 횟수를 기록하고, 사라지기 전에 합치세요</p>
        </div>
      </div>
      <div class="searchbar">
        <input id="search" type="text" placeholder="아이템 이름 검색 (예: 건전지, 증류기)">
      </div>
      <div class="legend">
        <span><i class="dot" style="background:var(--moss)"></i>진행중</span>
        <span><i class="dot" style="background:var(--amber)"></i>합칠 시간</span>
        <span><i class="dot" style="background:var(--rust)"></i>곧 사라짐(펑)</span>
        <span><i class="dot" style="background:var(--broken)"></i>고장</span>
      </div>
      <p class="tip">💡 ＋ 버튼을 꾹 누르면 연속으로 올라가요 · 📦 버튼으로 창고/보드 구분</p>
    </div>
  </header>
  <div class="stickybar">
    <div class="tabs" id="cattabs"></div>
    <div class="subtabs" id="subtabs" style="display:none;"></div>
  </div>

  <main id="content"></main>

  <footer>
    <button class="resetbtn" id="resetAll">전체 기록 초기화</button>
    <p class="savehint">기록은 이 브라우저에 자동 저장돼요</p>
  </footer>
</div>

/* ---------------- 상태 ---------------- */
let instances = {}; // key: familyId or familyId__variantIdx -> array of {id,stage,count,broken,cycles}
let curCat = '전체';
let curSub = null;
let query = '';
const openCards = new Set();

function uid(){ return Math.random().toString(36).slice(2,9); }

function keyFor(fam, variantIdx){
  return variantIdx===undefined ? fam.id : (fam.id+'__'+variantIdx);
}

async function loadState(){
  try{
    const r = await window.storage.get('ms_instances', false);
    if(r && r.value){ instances = JSON.parse(r.value); }
  }catch(e){ instances = {}; }
}
let saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set('ms_instances', JSON.stringify(instances), false); }
    catch(e){ console.error('저장 실패', e); }
  }, 250);
}

function getList(k){
  if(!instances[k]) instances[k]=[];
  return instances[k];
}

/* ---------------- 렌더링 ---------------- */
function renderTabs(){
  const cattabs = document.getElementById('cattabs');
  const cats = ['전체','생산','우표'];
  cattabs.innerHTML = cats.map(c=>{
    const label = c==='전체'?'전체':(c==='생산'?'생산 아이템':'우표 스토리');
    return `<button class="tab ${curCat===c?'active':''}" data-cat="${c}">${label}</button>`;
  }).join('');
  cattabs.querySelectorAll('.tab').forEach(b=>{
    b.onclick=()=>{ curCat=b.dataset.cat; curSub=null; render(); };
  });

  const subtabs = document.getElementById('subtabs');
  if(curCat==='우표'){
    subtabs.style.display='flex';
    subtabs.innerHTML = `<button class="subtab ${curSub===null?'active':''}" data-sub="">전체</button>` +
      SUBGROUPS.map(s=>`<button class="subtab ${curSub===s?'active':''}" data-sub="${s}">${s}</button>`).join('');
    subtabs.querySelectorAll('.subtab').forEach(b=>{
      b.onclick=()=>{ curSub = b.dataset.sub || null; render(); };
    });
  } else {
    subtabs.style.display='none';
  }
}

function familyPreview(fam){
  if(fam.type==='repairgroup'){
    return fam.variants.map(v=>v.max).join(' · ');
  }
  return fam.stages.map(s=>s.max).join(' · ');
}

function chipClass(count,max,broken,isFinalPop){
  if(broken) return 'chip broken';
  if(count>=max){ return isFinalPop ? 'chip pop' : 'chip ready'; }
  return 'chip';
}

let armedDelete = null; // {k, id, timer}
function isArmed(k,id){ return !!armedDelete && armedDelete.k===k && armedDelete.id===id; }
function requestDelete(k,id){
  if(isArmed(k,id)){
    clearTimeout(armedDelete.timer);
    instances[k] = getList(k).filter(i=>i.id!==id);
    armedDelete=null;
    saveState(); render();
    return;
  }
  if(armedDelete){ clearTimeout(armedDelete.timer); }
  armedDelete = {k, id, timer: setTimeout(()=>{ armedDelete=null; render(); }, 3000)};
  render();
}

function chipHtml(k, inst, max, isFinalPop, forcedBroken){
  const broken = forcedBroken || false;
  const cls = chipClass(inst.count, max, broken, isFinalPop) + (inst.stored?' stored':'');
  const pct = Math.min(100, inst.count/max*100);
  const armed = isArmed(k, inst.id);
  const ctrl = inst.stored
    ? `<div class="ctrl">
        <button data-act="loc" data-k="${k}" data-id="${inst.id}" title="보드로 꺼내기">📤</button>
        <button class="${armed?'confirm':''}" data-act="del" data-k="${k}" data-id="${inst.id}">${armed?'삭제?':'×'}</button>
      </div>`
    : `<button class="plusbtn" data-act="tap" data-k="${k}" data-id="${inst.id}">＋</button>
      <div class="ctrl">
        <button data-act="dec" data-k="${k}" data-id="${inst.id}">−</button>
        <button data-act="loc" data-k="${k}" data-id="${inst.id}" title="창고에 보관">📦</button>
        <button class="${armed?'confirm':''}" data-act="del" data-k="${k}" data-id="${inst.id}">${armed?'삭제?':'×'}</button>
      </div>`;
  return `<div class="${cls}" data-k="${k}" data-id="${inst.id}">
    ${broken?'<div class="tag">🔧</div>':''}
    ${inst.stored?'<div class="loc-tag">🔒 창고</div>':''}
    <div class="count">${inst.count}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    ${ctrl}
  </div>`;
}

function renderStageChips(k, list, max, isFinalPop, isBroken){
  const board = list.filter(i=>!i.stored);
  const stored = list.filter(i=>i.stored);
  let html = `<div class="chips">`;
  board.forEach(inst=> html += chipHtml(k, inst, max, isFinalPop, isBroken && isBroken(inst)));
  html += `<div class="addchip" data-act="add" data-k="${k}">＋</div></div>`;
  if(stored.length){
    html += `<div class="stored-label">📦 창고 보관 중</div><div class="chips">`;
    stored.forEach(inst=> html += chipHtml(k, inst, max, isFinalPop, isBroken && isBroken(inst)));
    html += `</div>`;
  }
  return html;
}

function renderChain(fam){
  let html='';
  fam.stages.forEach((st, idx)=>{
    const k = keyFor(fam, undefined)+'__s'+idx;
    const list = getList(k);
    const isLast = idx===fam.stages.length-1;
    const isFinalPop = isLast && !fam.repair;
    const suffix = fam.repair ? ' · 고장' : (isLast?' · 펑':' · 여기까지 누르고 합치기');
    html += `<div class="stage-block">
      <div class="stage-title"><span>${st.label?st.label+' ':''}</span><span class="max">최대 ${st.max}회${suffix}</span></div>
      ${st.note?`<div class="stage-note">${st.note}</div>`:''}`;
    html += renderStageChips(k, list, st.max, isFinalPop, fam.repair?(i=>i.count>=st.max):null);
    const nonBrokenCount = list.filter(i=> !(fam.repair && i.count>=st.max)).length;
    const brokenCount = fam.repair ? list.filter(i=>i.count>=st.max).length : 0;
    const actions=[];
    if(!isLast && nonBrokenCount>=2){
      actions.push(`<button class="btn-sm btn-merge" data-act="merge" data-k="${k}" data-fam="${fam.id}" data-idx="${idx}">🔗 2개 합쳐서 다음 단계로</button>`);
    }
    if(fam.repair && brokenCount>=2){
      actions.push(`<button class="btn-sm btn-repair" data-act="repairmerge" data-k="${k}">🔧 고장 2개 합쳐서 수리</button>`);
    }
    if(actions.length){ html += `<div class="actionrow">${actions.join('')}</div>`; }
    html += `</div>`;
  });
  return html;
}

function renderSingle(fam){
  const st = fam.stages[0];
  const k = keyFor(fam, undefined)+'__s0';
  const list = getList(k);
  let html = `<div class="stage-block">
    <div class="stage-title"><span class="max">최대 ${st.max}회 · 펑</span></div>
    ${st.note?`<div class="stage-note">${st.note}</div>`:''}`;
  html += renderStageChips(k, list, st.max, true, null);
  html += `</div>`;
  return html;
}

function renderRepairGroup(fam){
  let html='';
  fam.variants.forEach((v, idx)=>{
    const k = keyFor(fam, idx);
    const list = getList(k);
    const brokenList = list.filter(i=>i.broken);
    html += `<div class="stage-block">
      <div class="stage-title"><span>${v.label}</span><span class="max">쿨타임 ${v.max}회 → ${v.reward}${v.breakCycles?` · ${v.breakCycles}회차에 고장`:''}</span></div>
      <div class="chips">`;
    list.forEach(inst=>{
      const broken = !!inst.broken;
      const cls = chipClass(inst.count, v.max, broken);
      html += `<div class="${cls}" data-act="tap" data-k="${k}" data-id="${inst.id}">
        ${broken?'<div class="tag">🔧</div>':''}
        <div class="count">${inst.count}</div>
        <div class="bar"><i style="width:${Math.min(100,inst.count/v.max*100)}%"></i></div>
        <div class="cycle">${inst.cycles||0}회차 완료</div>
        <div class="ctrl">
          <button data-act="dec" data-k="${k}" data-id="${inst.id}">−</button>
          <button data-act="brk" data-k="${k}" data-id="${inst.id}">🔧</button>
          <button data-act="del" data-k="${k}" data-id="${inst.id}">×</button>
        </div>
      </div>`;
    });
    html += `<div class="addchip" data-act="add" data-k="${k}">＋</div></div>`;
    const hasHarvest = list.some(i=>!i.broken && i.count>=v.max);
    const actions=[];
    if(hasHarvest) actions.push(`<button class="btn-sm btn-harvest" data-act="harvest" data-k="${k}" data-max="${v.max}" data-breakcycles="${v.breakCycles||0}">🌊 수확하고 초기화</button>`);
    if(brokenList.length>=2) actions.push(`<button class="btn-sm btn-repair" data-act="repair" data-k="${k}">🔧 고장 2개 합쳐서 수리</button>`);
    if(actions.length) html += `<div class="actionrow">${actions.join('')}</div>`;
    html += `</div>`;
  });
  return html;
}

function render(){
  renderTabs();
  const content = document.getElementById('content');
  let families = DB.filter(f=>{
    if(curCat!=='전체' && f.cat!==curCat) return false;
    if(curCat==='우표' && curSub && f.sub!==curSub) return false;
    if(query && !f.name.toLowerCase().includes(query.toLowerCase())) return false;
    return true;
  });

  if(families.length===0){
    content.innerHTML = `<div class="empty">해당하는 아이템이 없어요.</div>`;
    return;
  }

  // group by section label
  let html='';
  let lastSection = null;
  families.forEach(fam=>{
    const sectionLabel = fam.cat==='생산' ? '생산 아이템' : ('우표 스토리 · ' + (fam.sub||''));
    if(sectionLabel!==lastSection && curCat==='전체'){
      html += `<div class="section-label">${sectionLabel}</div>`;
      lastSection = sectionLabel;
    }
    const isOpen = openCards.has(fam.id);
    html += `<div class="card ${isOpen?'open':''}" id="card-${fam.id}">
      <div class="card-head" data-toggle="${fam.id}">
        <div class="icon-badge">${fam.icon}</div>
        <div class="card-title">
          <div class="name">${fam.name}</div>
          <div class="preview">${familyPreview(fam)}</div>
        </div>
        <div class="chev">▶</div>
      </div>
      <div class="card-body">
        ${fam.type==='chain'?renderChain(fam):fam.type==='single'?renderSingle(fam):renderRepairGroup(fam)}
      </div>
    </div>`;
  });
  content.innerHTML = html;

  content.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick=()=>{
      const id = el.dataset.toggle;
      if(openCards.has(id)) openCards.delete(id); else openCards.add(id);
      render();
    };
  });

  content.querySelectorAll('[data-act]').forEach(el=>{
    if(el.dataset.act==='tap') return; // 탭/꾹누르기는 별도 포인터 핸들러가 처리
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      handleAction(el.dataset);
    });
  });
}

function findFamById(id){ return DB.find(f=>f.id===id); }

function stageMaxForKey(k){
  // key patterns: famId__sIDX  or  famId__IDX (repairgroup, no harvest needed here)
  const parts = k.split('__');
  const famId = parts[0];
  const fam = findFamById(famId);
  if(!fam) return 999999;
  if(parts[1] && parts[1].startsWith('s')){
    const idx = parseInt(parts[1].slice(1));
    return fam.stages[idx].max;
  } else if(fam.type==='repairgroup'){
    const idx = parseInt(parts[1]);
    return fam.variants[idx].max;
  }
  return 999999;
}

function handleAction(ds){
  const act = ds.act;
  const k = ds.k;

  if(act==='add'){
    getList(k).push({id:uid(), count:0, broken:false, cycles:0});
    saveState(); render(); return;
  }
  if(act==='tap'){
    const list = getList(k);
    const inst = list.find(i=>i.id===ds.id);
    if(inst && !inst.broken && !inst.stored){
      const max = stageMaxForKey(k);
      inst.count = Math.min(max, inst.count+1);
    }
    saveState(); render(); return;
  }
  if(act==='dec'){
    const list = getList(k);
    const inst = list.find(i=>i.id===ds.id);
    if(inst && !inst.stored){ inst.count = Math.max(0, inst.count-1); }
    saveState(); render(); return;
  }
  if(act==='del'){
    requestDelete(k, ds.id);
    return;
  }
  if(act==='loc'){
    const list = getList(k);
    const inst = list.find(i=>i.id===ds.id);
    if(inst){ inst.stored = !inst.stored; }
    saveState(); render(); return;
  }
  if(act==='brk'){
    const list = getList(k);
    const inst = list.find(i=>i.id===ds.id);
    if(inst){ inst.broken = !inst.broken; }
    saveState(); render(); return;
  }
  if(act==='merge'){
    const fam = findFamById(ds.fam);
    const idx = parseInt(ds.idx);
    const st = fam.stages[idx];
    const list = getList(k);
    const nonBroken = list.filter(i=> !(fam.repair && i.count>=st.max));
    if(nonBroken.length>=2){
      const removeIds = new Set([nonBroken[0].id, nonBroken[1].id]);
      instances[k] = list.filter(i=>!removeIds.has(i.id));
      const nextKey = ds.fam+'__s'+(idx+1);
      getList(nextKey).push({id:uid(), count:0, broken:false, cycles:0});
    }
    saveState(); render(); return;
  }
  if(act==='repairmerge'){
    const famId = k.split('__')[0];
    const fam = findFamById(famId);
    const idx = parseInt(k.split('__s')[1]);
    const st = fam.stages[idx];
    const list = getList(k);
    const broken = list.filter(i=>i.count>=st.max);
    if(broken.length>=2){
      const removeIds = new Set([broken[0].id, broken[1].id]);
      instances[k] = list.filter(i=>!removeIds.has(i.id));
      getList(k).push({id:uid(), count:0, broken:false, cycles:0});
    }
    saveState(); render(); return;
  }
}

document.getElementById('search').addEventListener('input', (e)=>{
  query = e.target.value; render();
});

/* 꾹 누르기: 누르고 있으면 계속 증가. 매 tick마다 전체 재렌더링을 하면
   누르고 있던 버튼이 DOM에서 교체되어 손을 뗐을 때 이벤트가 유실되므로,
   보유 중에는 해당 칩만 직접 갱신하고 손을 뗀 시점에 한 번만 전체 렌더링한다. */
function getStageInfo(k){
  const parts = k.split('__');
  const fam = findFamById(parts[0]);
  if(!fam) return null;
  const stIdx = parseInt(parts[1].slice(1));
  return {fam, stIdx, st: fam.stages[stIdx]};
}
function refreshChipDom(k, id){
  const info = getStageInfo(k);
  if(!info) return;
  const {fam, st, stIdx} = info;
  const isLast = stIdx === fam.stages.length-1;
  const isFinalPop = isLast && !fam.repair;
  const inst = getList(k).find(i=>i.id===id);
  if(!inst) return;
  const el = document.querySelector('.chip[data-k="'+CSS.escape(k)+'"][data-id="'+CSS.escape(id)+'"]');
  if(!el) return;
  const broken = fam.repair && inst.count>=st.max;
  el.className = chipClass(inst.count, st.max, broken, isFinalPop) + (inst.stored?' stored':'');
  const countEl = el.querySelector('.count');
  if(countEl) countEl.textContent = inst.count;
  const barEl = el.querySelector('.bar i');
  if(barEl) barEl.style.width = Math.min(100, inst.count/st.max*100)+'%';
  const hasTag = !!el.querySelector('.tag');
  if(broken && !hasTag) el.insertAdjacentHTML('afterbegin','<div class="tag">🔧</div>');
  if(!broken && hasTag) el.querySelector('.tag').remove();
}
function doTap(ds){
  const inst = getList(ds.k).find(i=>i.id===ds.id);
  if(inst && !inst.stored){
    const max = stageMaxForKey(ds.k);
    inst.count = Math.min(max, inst.count+1);
    refreshChipDom(ds.k, ds.id);
    saveState();
  }
}
let holdTimer=null, holdInterval=null;
function stopHold(){
  clearTimeout(holdTimer); clearInterval(holdInterval);
  holdTimer=null; holdInterval=null;
}
document.addEventListener('pointerdown', (e)=>{
  const el = e.target.closest('[data-act]');
  if(!el || el.dataset.act!=='tap') return;
  e.preventDefault();
  const ds = {k:el.dataset.k, id:el.dataset.id};
  stopHold();
  doTap(ds);
  holdTimer = setTimeout(()=>{
    holdInterval = setInterval(()=>{ doTap(ds); }, 110);
  }, 420);
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev, ()=>{
  if(holdTimer||holdInterval){ stopHold(); render(); }
}));
window.addEventListener('blur', ()=>{ stopHold(); render(); });

document.getElementById('resetAll').addEventListener('click', async ()=>{
  if(confirm('모든 기록을 초기화할까요? 되돌릴 수 없어요.')){
    instances = {};
    saveState(); render();
  }
});

(async function init(){
  await loadState();
  render();
})();
</script>
</body>
